<!DOCTYPE html>
<html>
<body style="font-family:sans-serif;text-align:center;background:#eef4f8;margin:0">
<h3>How a Hydroelectric Power Plant Works</h3>
<canvas id="c" width="940" height="500" style="background:#fff;border:1px solid #888"></canvas><br>
Intake gate opening: <input id="g" type="range" min="0" max="100" value="60">
<script>
const c=document.getElementById('c'),x=c.getContext('2d'),gate=document.getElementById('g');
const path=[[300,330],[400,330],[400,400],[452,400]];
// path length helper
const seg=[];let total=0;
for(let i=0;i<path.length-1;i++){const l=Math.hypot(path[i+1][0]-path[i][0],path[i+1][1]-path[i][1]);seg.push(l);total+=l;}
function at(d){for(let i=0;i<seg.length;i++){if(d<=seg[i]){const t=d/seg[i];return[path[i][0]+(path[i+1][0]-path[i][0])*t,path[i][1]+(path[i+1][1]-path[i][1])*t];}d-=seg[i];}return path[path.length-1];}
const pen=[],res=[],tail=[],cur=[];
for(let i=0;i<40;i++)pen.push(Math.random()*total);
for(let i=0;i<60;i++)res.push([Math.random()*280,175+Math.random()*235]);
for(let i=0;i<30;i++)tail.push([510+Math.random()*420,405+Math.random()*30]);
for(let i=0;i<30;i++)cur.push(Math.random());
let ang=0,spd=0;
function lab(t,px,py,tx,ty){x.strokeStyle='#333';x.lineWidth=1;x.beginPath();x.moveTo(px,py);x.lineTo(tx,ty);x.stroke();
  x.fillStyle='#000';x.font='bold 13px sans-serif';x.textAlign='center';x.fillText(t,tx,ty-4);}
function frame(){
  const f=gate.value/100;
  spd+=(f-spd)*0.05;
  x.clearRect(0,0,940,500);
  // sky/ground
  x.fillStyle='#8a6d4b';x.fillRect(0,420,940,80);
  // reservoir
  x.fillStyle='#8ecbf0';x.fillRect(0,170,300,250);
  x.fillStyle='#fff';x.globalAlpha=.5;res.forEach(p=>{p[0]-=spd*1.5;if(p[0]<0)p[0]=300; x.fillRect(p[0],p[1],8,2);});x.globalAlpha=1;
  // dam
  x.fillStyle='#9a9a9a';x.beginPath();x.moveTo(300,150);x.lineTo(360,150);x.lineTo(400,420);x.lineTo(300,420);x.fill();
  // powerhouse
  x.fillStyle='#c9b27c';x.fillRect(420,270,150,150);x.fillStyle='#a3562b';x.fillRect(410,255,170,18);
  // penstock
  x.strokeStyle='#555';x.lineWidth=26;x.lineJoin='round';x.beginPath();x.moveTo(...path[0]);path.slice(1).forEach(p=>x.lineTo(...p));x.stroke();
  x.strokeStyle='#bfe4fa';x.lineWidth=20;x.beginPath();x.moveTo(...path[0]);path.slice(1).forEach(p=>x.lineTo(...p));x.stroke();
  x.fillStyle='#1f78b4';
  pen.forEach((d,i)=>{pen[i]=(d+spd*3)%total;const p=at(pen[i]);x.beginPath();x.arc(p[0],p[1],3,0,7);x.fill();});
  // gate
  x.fillStyle='#c33';x.fillRect(292,300,10,30-30*f);x.fillRect(292,300,10,0);
  x.fillStyle='#800';x.fillRect(288,296,18,6);
  // turbine
  ang+=spd*0.3;
  x.save();x.translate(480,400);x.rotate(ang);x.fillStyle='#333';
  for(let i=0;i<6;i++){x.rotate(Math.PI/3);x.fillRect(4,-4,26,8);}
  x.beginPath();x.arc(0,0,8,0,7);x.fillStyle='#000';x.fill();x.restore();
  // shaft + generator
  x.fillStyle='#555';x.fillRect(477,350,6,40);
  x.fillStyle='#333';x.beginPath();x.arc(480,330,32,0,7);x.fill();
  x.strokeStyle=`rgba(255,${200-120*spd|0},0,${0.3+spd*0.7})`;x.lineWidth=5;
  x.save();x.translate(480,330);x.rotate(ang);for(let i=0;i<4;i++){x.rotate(Math.PI/2);x.beginPath();x.moveTo(8,0);x.lineTo(24,0);x.stroke();}x.restore();
  // tailrace
  x.fillStyle='#8ecbf0';x.fillRect(510,405,430,40);
  x.fillStyle='#1f78b4';tail.forEach(p=>{p[0]+=spd*2;if(p[0]>940)p[0]=510;x.fillRect(p[0],p[1],7,2);});
  // transformer + lines
  x.fillStyle='#678';x.fillRect(610,380,40,40);x.fillStyle='#fc3';x.fillRect(620,370,20,10);
  x.strokeStyle='#222';x.lineWidth=2;
  [[720,420,720,260],[860,420,860,260]].forEach(p=>{x.beginPath();x.moveTo(p[0],p[1]);x.lineTo(p[2],p[3]);x.stroke();
    x.beginPath();x.moveTo(p[0]-25,p[3]+15);x.lineTo(p[0]+25,p[3]+15);x.stroke();});
  x.beginPath();x.moveTo(630,370);x.quadraticCurveTo(675,345,720,275);x.quadraticCurveTo(790,300,860,275);x.quadraticCurveTo(910,290,940,285);x.stroke();
  x.fillStyle='#fd0';
  cur.forEach((t,i)=>{cur[i]=(t+spd*0.01)%1;const px=630+cur[i]*310;const py=px<720?370-(px-630)/90*95:275+Math.sin((px-720)/140*Math.PI)*12;
    if(spd>0.05){x.beginPath();x.arc(px,py,3,0,7);x.fill();}});
  // labels
  lab('Reservoir',150,230,150,150);
  lab('Dam',335,300,335,130);
  lab('Intake gate',297,305,230,280);
  lab('Penstock',350,330,350,300);
  lab('Turbine',480,400,500,468);
  lab('Generator',480,300,480,240);
  lab('Powerhouse',545,300,620,250);
  lab('Transformer',630,400,630,470);
  lab('Transmission lines',790,278,790,225);
  lab('Tailrace (river)',800,430,800,480);
  x.font='13px sans-serif';x.fillStyle='#036';x.textAlign='left';
  x.fillText('Power output: '+(spd*100|0)+'%',20,40);
  x.fillText('Stored (potential) energy → kinetic energy → mechanical energy → electrical energy',20,64);
  requestAnimationFrame(frame);
}
frame();
</script>
</body>
</html>
